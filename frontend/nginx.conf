server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /api/ { proxy_pass http://api-gateway:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_connect_timeout 5s; proxy_read_timeout 15s; }
  location / { try_files $uri $uri/ /index.html; }
}
