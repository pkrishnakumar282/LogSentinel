[project]
name = "logsentinel-ai"
version = "0.1.0"
description = "Multi-source log anomaly detection platform"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Redis and PostgreSQL", "e2e: requires the complete stack"]

[tool.mypy]
python_version = "3.12"
strict = true
