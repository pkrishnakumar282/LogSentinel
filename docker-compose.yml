# Phase 1: infrastructure only. Application services arrive in phases 2–9.
x-service-defaults: &defaults
  restart: unless-stopped
  networks: [backend]
  mem_limit: 512m
  cpus: 1.0
  security_opt: [no-new-privileges:true]

services:
  postgres:
    <<: *defaults
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logsentinel}
      POSTGRES_USER: ${POSTGRES_USER:-logsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  redis:
    <<: *defaults
    image: redis:7.4-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    internal: true
volumes:
  postgres-data:
  redis-data:
